syntax = "proto3";

package gateway;

import "auth.proto";
import "common.proto";
import "notification.proto";
import "project.proto";
import "subject.proto";
import "eval.proto";
import "google/protobuf/timestamp.proto";

service FrontendGateway {
  rpc Register(auth.RegisterRequest) returns (auth.AuthResponse);
  rpc CreateUser(auth.CreateUserRequest) returns (auth.User);
  rpc UpdateUser(auth.UpdateUserRequest) returns (auth.User);
  rpc SetUserAvatar(auth.SetUserAvatarRequest) returns (common.Ack);
  rpc Login(auth.LoginRequest) returns (auth.AuthResponse);
  rpc GetMe(common.Empty) returns (auth.User);
  rpc GetUser(auth.GetUserRequest) returns (auth.User);
  rpc ListUsers(common.Empty) returns (auth.ListUsersResponse);
  rpc ChangePassword(ChangePasswordGatewayRequest) returns (common.Ack);
  rpc Logout(common.Empty) returns (common.Ack);

  rpc ListSubjects(common.Empty) returns (subject.ListSubjectsResponse);
  rpc GetSubject(subject.GetSubjectRequest) returns (subject.Subject);
  rpc CreateSubject(subject.CreateSubjectRequest) returns (subject.Subject);
  rpc UpdateSubject(subject.UpdateSubjectRequest) returns (subject.Subject);
  rpc DeleteSubject(subject.DeleteSubjectRequest) returns (common.Ack);
  rpc RegisterSubject(RegisterSubjectGatewayRequest) returns (common.Ack);
  rpc LeaveSubject(LeaveSubjectGatewayRequest) returns (common.Ack);
  rpc AddStudentToSubject(subject.UserSubjectRequest) returns (common.Ack);
  rpc RemoveStudentFromSubject(subject.UserSubjectRequest) returns (common.Ack);
  rpc AssignTeacherToSubject(subject.TeacherSubjectRequest) returns (subject.Subject);
  rpc RemoveTeacherFromSubject(subject.TeacherSubjectRequest) returns (subject.Subject);

  rpc ListProjects(project.ListProjectsRequest) returns (project.ListProjectsResponse);
  // Single-call replacement for "list projects + per-project list_teams_by_project". When
  // subject_id is empty the router fans out across every subject server-side. Each entry
  // bundles a Project with its Teams (basic shape, student_ids enriched).
  rpc ListProjectsWithTeams(ListProjectsWithTeamsGatewayRequest)
      returns (ListProjectsWithTeamsGatewayResponse);
  rpc GetProject(project.GetProjectRequest) returns (project.Project);
  rpc CreateProject(CreateProjectGatewayRequest) returns (project.Project);
  rpc UpdateProject(project.UpdateProjectRequest) returns (project.Project);
  rpc DeleteProject(project.DeleteProjectRequest) returns (common.Ack);
  rpc RegisterTeam(project.RegisterTeamRequest) returns (project.Team);
  rpc GetTeam(project.GetTeamRequest) returns (project.TeamDetail);
  rpc ListTeamsByProject(project.ListTeamsByProjectRequest)
      returns (ListTeamsByProjectGatewayResponse);
  // Single-call replacement for "list teams + per-team get_team" — returns each team's
  // detail (with embedded submission and evaluation) for the project. For students the
  // server filters to just their own team.
  rpc ListProjectTeamDetails(ListProjectTeamDetailsGatewayRequest)
      returns (ListProjectTeamDetailsGatewayResponse);
  rpc LeaveTeam(project.LeaveTeamRequest) returns (common.Ack);
  rpc ChangeTeamLeader(project.ChangeTeamLeaderRequest) returns (project.Team);
  rpc AddTeamMember(project.AddTeamMemberRequest) returns (project.Team);
  rpc RemoveTeamMember(project.RemoveTeamMemberRequest) returns (project.Team);
  rpc CreateJoinRequest(project.CreateJoinRequestRequest) returns (project.JoinRequest);
  rpc DeleteJoinRequest(project.DeleteJoinRequestRequest) returns (common.Ack);
  rpc ResolveJoinRequest(project.ResolveJoinRequestRequest) returns (project.JoinRequest);
  rpc ListJoinRequests(project.ListJoinRequestsRequest) returns (project.ListJoinRequestsResponse);
  rpc SubmitProject(project.SubmitProjectRequest) returns (project.ProjectSubmission);
  rpc DeleteSubmission(project.DeleteSubmissionRequest) returns (common.Ack);
  rpc DownloadSubmission(project.DownloadSubmissionRequest) returns (stream project.FileChunk);

  rpc ListNotifications(common.Empty) returns (ListNotificationsGatewayResponse);
  rpc ListScheduledNotifications(common.Empty)
      returns (notification.ListScheduledNotificationsResponse);
  rpc CreateNotification(CreateNotificationGatewayRequest)
      returns (CreateNotificationGatewayResponse);
  rpc MarkNotificationRead(notification.MarkAsReadRequest) returns (common.Ack);
  rpc CancelScheduledNotification(CancelScheduledNotificationGatewayRequest)
      returns (common.Ack);
  rpc RescheduleScheduledNotification(RescheduleScheduledNotificationGatewayRequest)
      returns (common.Ack);
  rpc StreamNotifications(common.Empty) returns (stream NotificationWithSender);

  rpc GetProjectEvaluation(eval.GetProjectEvaluationRequest) returns (eval.ProjectEvaluation);
  rpc ListProjectEvaluations(eval.ListProjectEvaluationsRequest) returns (eval.ListProjectEvaluationsResponse);
  rpc CreateProjectEvaluation(eval.CreateProjectEvaluationRequest) returns (eval.ProjectEvaluation);
  rpc UpdateProjectEvaluation(eval.UpdateProjectEvaluationRequest) returns (eval.ProjectEvaluation);
  rpc DeleteProjectEvaluation(eval.DeleteEvaluationRequest) returns (common.Ack);
}

message RegisterSubjectGatewayRequest { string subject_id = 1; }

message LeaveSubjectGatewayRequest { string subject_id = 1; }

message ChangePasswordGatewayRequest {
  string current_password = 1;
  string new_password = 2;
}

message CreateProjectGatewayRequest {
  string title = 1;
  string description = 2;
  uint32 max_students_per_team = 3;
  uint64 submission_size_limit = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp end_date = 6;
  string subject_id = 7;
  float max_points = 8;
}

message CreateNotificationGatewayRequest {
  repeated string user_ids = 1;
  string message = 2;
  google.protobuf.Timestamp trigger_at = 3;
}

message NotificationWithSender {
  notification.Notification notification = 1;
  auth.User sender = 2;
}

message ListNotificationsGatewayResponse {
  repeated NotificationWithSender notifications = 1;
}

message CreateNotificationGatewayResponse {
  repeated NotificationWithSender notifications = 1;
}

message ListTeamsByProjectGatewayResponse {
  repeated project.Team teams = 1;
}

message ListProjectTeamDetailsGatewayRequest { string project_id = 1; }

message ListProjectTeamDetailsGatewayResponse {
  repeated project.TeamDetail teams = 1;
}

message ListProjectsWithTeamsGatewayRequest { string subject_id = 1; }

message ProjectWithTeams {
  project.Project project = 1;
  repeated project.Team teams = 2;
}

message ListProjectsWithTeamsGatewayResponse {
  repeated ProjectWithTeams projects = 1;
}

message CancelScheduledNotificationGatewayRequest { string batch_id = 1; }

message RescheduleScheduledNotificationGatewayRequest {
  string batch_id = 1;
  google.protobuf.Timestamp trigger_at = 2;
}
