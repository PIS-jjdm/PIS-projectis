spring.datasource.url=jdbc:postgresql://project-postgres:${POSTGRES_PORT}/${POSTGRES_DB}

spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.grpc.server.port=${GRPC_PORT}
# 12 MiB: leaves headroom on top of the 10 MB user-facing submission size cap for protobuf framing.
spring.grpc.server.max-inbound-message-size=12582912
server.port=${HTTP_PORT}

spring.grpc.client.channels.auth.address=${AUTH_GRPC_ENDPOINT:auth-service:50051}
spring.grpc.client.channels.notification.address=${NOTIFICATION_GRPC_ENDPOINT:auth-service:50052}
spring.grpc.client.channels.subject.address=${SUBJECT_GRPC_ENDPOINT:subject-service:50053}
spring.grpc.client.channels.evaluation.address=${EVALUATION_GRPC_ENDPOINT:evaluation-service:50055}

spring.jpa.open-in-view=false

# Enable health indicators for database and gRPC
management.health.defaults.enabled=true
management.endpoint.health.show-details=always

# Expose endpoints on your HTTP_PORT (40054)
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true

# Ensure the database check uses the correct port
management.health.db.enabled=true
