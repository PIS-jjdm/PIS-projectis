services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      # - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      # - 55679:55679 # zpages extension

  prometheus:
    image: prom/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - blackbox-exporter

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  loki:
    image: grafana/loki:latest
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:latest
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    ports:
      - "12345:12345"
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service-rust/Dockerfile
    environment:
      AUTH_SERVICE_ADDR: 0.0.0.0:50051
      DB_PATH: /data/auth-db
      SURREAL_NAMESPACE: university_auth
      SURREAL_DATABASE: auth
      JWT_SECRET: super-secret-dev-key
      NOTIFICATION_GRPC_ENDPOINT: http://notification-service:50052
      SEED_DEMO_USERS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: auth-service
      RUST_LOG: info
    depends_on:
      - otel-collector
      - notification-service
    volumes:
      - auth_data:/data

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service-rust/Dockerfile
    environment:
      NOTIFICATION_SERVICE_ADDR: 0.0.0.0:50052
      DB_PATH: /data/notification-db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: notification-service
      RUST_LOG: info
    depends_on:
      - otel-collector
    volumes:
      - notification_data:/data

  subject-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subject
      POSTGRES_USER: subject
      POSTGRES_PASSWORD: subject
    volumes:
      - subject_db_data:/var/lib/postgresql/data

  subject-service:
    build:
      context: .
      dockerfile: services/subject-service-dotnet/Dockerfile
    environment:
      SUBJECT_SERVICE_PORT: 50053
      SUBJECT_HEALTH_PORT: 50080
      ConnectionStrings__SubjectDb: Host=subject-db;Port=5432;Database=subject;Username=subject;Password=subject
      AUTH_GRPC_ENDPOINT: http://auth-service:50051
      PROJECT_GRPC_ENDPOINT: http://project-service:50054
      SEED_DEMO_SUBJECTS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: subject-service
    depends_on:
      - auth-service
      - otel-collector
      - subject-db
    ports:
      - "50053:50053"
      - "50080:50080"
  #

  project-postgres:
    image: postgres:15
    command: -p 30054
    env_file:
      - ./services/project-service/.env.example
    volumes:
      - project_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p 30054"]
      interval: 5s
      timeout: 5s
      retries: 5

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    env_file:
      - ./services/project-service/.env.example
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: project-service
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      AUTH_GRPC_ENDPOINT: auth-service:50051
      NOTIFICATION_GRPC_ENDPOINT: notification-service:50052
      EVALUATION_GRPC_ENDPOINT: evaluation-service:50055
      JAVA_TOOL_OPTIONS: --add-opens=java.base/java.nio=ALL-UNNAMED --enable-native-access=ALL-UNNAMED
    depends_on:
      - project-postgres
      - otel-collector

  evaluation-service:
    build:
      context: .
      dockerfile: services/evaluation-service-rust/Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0
      BIND_PORT: 50055
      DATA_DIR: /data/eval-db
      SEEDS_PATH: /app/seeds.toml
      OTLP_ENDPOINT: http://otel-collector:4317
      # SUBJECT_ENDPOINT: http://???
      NOTIFICATION_ENDPOINT: http://notification-service:50052
      PROJECT_ENDPOINT: http://project-service:50054
      RUST_LOG: info
    depends_on:
      - notification-service
    volumes:
      - eval_data:/data

  router:
    build:
      context: .
      dockerfile: services/router-rust/Dockerfile
    environment:
      ROUTER_GRPC_ADDR: 0.0.0.0:8081
      AUTH_GRPC_ENDPOINT: http://auth-service:50051
      NOTIFICATION_GRPC_ENDPOINT: http://notification-service:50052
      SUBJECT_GRPC_ENDPOINT: http://subject-service:50053
      PROJECT_GRPC_ENDPOINT: http://project-service:50054
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: router
      RUST_LOG: info,tower_http=info
    depends_on:
      - auth-service
      - notification-service
      - subject-service
      # - project-service
      - evaluation-service
      # - subject-service
      - project-service
      - otel-collector
    ports:
      - "8081:8081"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_MODE: hybrid
        VITE_GRPC_BASE_URL: /grpc
    depends_on:
      - router
    ports:
      - "3000:80"

volumes:
  auth_data:
  notification_data:
  subject_db_data:
  project_postgres_data:
  eval_data:
  grafana_data:
  loki_data:
  alloy_data:
